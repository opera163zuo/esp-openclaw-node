# Builds the Emscripten LVGL + Lua simulator for the retained live-scripting
# workflow. The former Skills Lab frontend and its deployment were removed with
# the skill system they depended on.
build_lua_lvgl_web_sim:
  stage: build
  tags:
    - build
  image: emscripten/emsdk:latest
  extends:
    - .rules:build:simulator
  variables:
    SIMULATOR_BUILD_DIR: "$CI_PROJECT_DIR/build/lua_lvgl_web_sim"
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake ninja-build python3-venv
    - emcmake cmake -S tools/lua_lvgl_web_sim -B "$SIMULATOR_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release
    - embuilder build sdl2
    - emmake ninja -C "$SIMULATOR_BUILD_DIR" esp_claw_sim
  artifacts:
    when: always
    paths:
      - build/lua_lvgl_web_sim/esp_claw_sim.*
    expire_in: 1 week
