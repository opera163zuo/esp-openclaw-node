## IDF Component Manager Manifest File
dependencies:
  espressif/esp_board_manager:
    version: "^0.6"
    public: true

  app_claw:
    path: ../../../components/common/app_claw

  app_config:
    path: ../components/app_config

  openclaw_node:
    path: ../../../components/openclaw_node

  cap_files:
    path: ../../../components/claw_capabilities/cap_files

  cap_lua:
    path: ../../../components/claw_capabilities/cap_lua

  espressif/esp_codec_dev: "*"

  espressif/esp_websocket_client:
    version: "^1.8"
    public: true

  captive_dns:
    path: ../../../components/common/captive_dns

  espressif/ramfs:
    version: "^0.1"

  claw_utils:
    path: ../../../components/claw_modules/claw_utils

  system_ui:
    rules:
    - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True
    path: ../../../components/common/system_ui

  http_reuse:
    path: ../../../components/common/http_reuse

  http_server:
    path: ../components/http_server

  settings:
    path: ../../../components/common/settings

  wifi_manager:
    path: ../../../components/common/wifi_manager

  time_sync:
    path: ../../../components/common/time_sync

  esp_video:
    path: ../../../components/common/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True
