# Note: All operators are binary operators. For more than two operands, you may use the nested parentheses trick.
# For example:
#    *  A == 1 or (B == 2 and C in [1,2,3])
#    *  (A == 1 and B == 2) or (C not in ["3", "4", 5])

application/edge_agent:
  enable:
    - if: INCLUDE_DEFAULT == 1

application/mcp_server_point:
  enable:
    - if: INCLUDE_DEFAULT == 1

# On-target regression suite for the Native Node transport, the config cache and
# the storage-root guard. It is not a board-manager project, so the board matrix
# does not change what it builds; it only needs to compile.
application/edge_agent/test_apps/fork_regression_test:
  enable:
    - if: INCLUDE_DEFAULT == 1
